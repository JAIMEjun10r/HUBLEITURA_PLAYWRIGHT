name: Playwright

on:
  workflow_dispatch:
    inputs:
      grupo:
        description: Grupo funcional de testes
        required: true
        default: todos
        type: choice
        options:
          - todos
          - auth
          - catalogo
          - cesta
          - reservas
          - admin
      navegador:
        description: Navegador usado pelo Playwright
        required: true
        default: chromium
        type: choice
        options:
          - chromium
      publicar_relatorios:
        description: Publicar artefatos somente se o repositório for privado
        required: false
        default: false
        type: boolean
      ambiente:
        description: Rótulo exposto como TEST_ENV nos relatórios
        required: true
        default: CI
        type: string
  push:
    branches:
      - main

# Sem gatilho "pull_request": em repositório público, qualquer pessoa pode
# abrir um fork e mandar PR contra a main, o que disparia a pipeline (e
# consumiria minutos de Actions) sem precisar de permissão nenhuma no repo.
# Sem esse gatilho, só quem tem permissão de escrita (push direto ou
# workflow_dispatch) consegue rodar — ou seja, só o dono/colaboradores.

jobs:
  preparar-matriz:
    name: Preparar matriz de testes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GRUPO_SELECIONADO: ${{ github.event_name == 'workflow_dispatch' && inputs.grupo || 'todos' }}
    steps:
      - name: Definir grupos de testes
        id: matrix
        shell: bash
        run: |
          if [ "$GRUPO_SELECIONADO" = "todos" ]; then
            matrix='{"include":[{"grupo":"auth","specs":"tests/auth.spec.ts"},{"grupo":"catalogo","specs":"tests/catalog.spec.ts"},{"grupo":"cesta","specs":"tests/basket.spec.ts"},{"grupo":"reservas","specs":"tests/reservation.spec.ts"},{"grupo":"admin","specs":"tests/admin.spec.ts tests/admin-permissions.spec.ts"}]}'
          else
            case "$GRUPO_SELECIONADO" in
              auth) specs="tests/auth.spec.ts" ;;
              catalogo) specs="tests/catalog.spec.ts" ;;
              cesta) specs="tests/basket.spec.ts" ;;
              reservas) specs="tests/reservation.spec.ts" ;;
              admin) specs="tests/admin.spec.ts tests/admin-permissions.spec.ts" ;;
              *) echo "Grupo inválido: $GRUPO_SELECIONADO" >&2; exit 1 ;;
            esac
            matrix=$(printf '{"include":[{"grupo":"%s","specs":"%s"}]}' "$GRUPO_SELECIONADO" "$specs")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  testes:
    name: Testes Playwright - ${{ matrix.grupo }}
    needs: preparar-matriz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preparar-matriz.outputs.matrix) }}
    env:
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || 'CI' }}
      REPORT_GROUP: ${{ matrix.grupo }}
      BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.navegador || 'chromium' }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps "$BROWSER"

      - name: Rodar testes do grupo ${{ matrix.grupo }}
        run: npx playwright test ${{ matrix.specs }} --project="$BROWSER"

      - name: Nomear dashboard do grupo ${{ matrix.grupo }}
        if: always()
        shell: bash
        run: |
          if [ -f "test-results/relatorio_execucao_latest.html" ]; then
            cp "test-results/relatorio_execucao_latest.html" "test-results/relatorio_execucao_${{ matrix.grupo }}.html"
          fi

      - name: Publicar relatório HTML
        if: ${{ always() && github.event.repository.private == true && (github.event_name != 'workflow_dispatch' || inputs.publicar_relatorios) }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.grupo }}
          path: playwright-report/
          retention-days: 7

      - name: Publicar dashboard do grupo ${{ matrix.grupo }}
        if: ${{ always() && github.event.repository.private == true && (github.event_name != 'workflow_dispatch' || inputs.publicar_relatorios) }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.grupo }}
          path: |
            test-results/relatorio_execucao_${{ matrix.grupo }}.html
            test-results/evidencias/
          retention-days: 7
          if-no-files-found: warn

      - name: Publicar evidências completas em caso de falha
        if: ${{ failure() && github.event.repository.private == true && (github.event_name != 'workflow_dispatch' || inputs.publicar_relatorios) }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.grupo }}
          path: test-results/
          retention-days: 7

  consolidar-relatorio:
    name: Consolidar dashboard de execução
    needs: testes
    if: ${{ always() && github.event.repository.private == true && (github.event_name != 'workflow_dispatch' || inputs.publicar_relatorios) }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar dashboards de cada grupo
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: consolidado
          merge-multiple: true
          if-no-files-found: warn

      - name: Gerar índice do relatório consolidado
        shell: bash
        run: |
          {
            echo '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Consolidado — Hub de Leitura</title>'
            echo '<style>body{font-family:system-ui,sans-serif;background:#F0F4F9;padding:40px;color:#1A2433}h1{margin-bottom:24px}ul{list-style:none;padding:0}li{margin-bottom:12px}a{display:inline-block;padding:12px 20px;background:#0D1F3C;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}a:hover{background:#1B3A5C}</style></head><body>'
            echo '<h1>Relatório de Execução — Hub de Leitura</h1><ul>'
            for file in consolidado/relatorio_execucao_*.html; do
              [ -f "$file" ] || continue
              base=$(basename "$file")
              case "$base" in
                *T[0-9]*|relatorio_execucao_latest.html) continue ;;
              esac
              grupo=$(basename "$file" .html | sed 's/^relatorio_execucao_//')
              echo "<li><a href=\"${base}\">${grupo}</a></li>"
            done
            echo '</ul></body></html>'
          } > consolidado/index.html

      - name: Publicar relatório consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-consolidado
          path: consolidado/
          retention-days: 15
          if-no-files-found: warn
